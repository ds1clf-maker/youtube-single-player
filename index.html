
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube 단독 재생</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 15px}
.box{background:#181818;padding:20px;border-radius:15px;margin-bottom:20px}
h2{margin-top:0}
input{width:100%;padding:15px;font-size:16px;border-radius:10px;border:0;margin-bottom:10px}
button{width:100%;min-height:52px;padding:15px;font-size:18px;font-weight:bold;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.99)}
.video{width:100%;aspect-ratio:16/9}
iframe{width:100%;height:100%;border:0}
.actions{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions button{background:#fff;color:#000}
.actions .share{background:#ff0033;color:#fff}
.library-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.library-filters{display:grid;grid-template-columns:1fr 170px;gap:10px;margin-bottom:10px}
.library-filters input{margin:0}
select{width:100%;padding:15px;font-size:16px;border:0;border-radius:10px;background:#fff;color:#000}
.library-status{color:#ccc;line-height:1.5}
.library-list{display:grid;gap:10px}
.library-item{background:#242424;border-radius:10px;padding:12px}
.library-title{margin-bottom:10px;color:#fff;font-weight:bold;word-break:break-all}
.library-meta{margin-bottom:10px;color:#aaa;font-size:13px}
.library-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.library-buttons button{min-height:44px;padding:10px;font-size:14px}
.favorite-on{background:#ffd54a!important;color:#000!important}
.notice{min-height:22px;margin-top:10px;color:#ccc;font-size:14px;text-align:center}
body.player-mode .wrap{max-width:none;min-height:100vh;padding:0;display:flex;align-items:center;justify-content:center}
body.player-mode .box,
body.player-mode .actions,
body.player-mode .library,
body.player-mode .notice{display:none!important}
body.player-mode .video{width:100vw;max-width:1100px}
@media (max-width:600px){
 .wrap{padding:14px 12px}
 .box{padding:16px;border-radius:12px}
 h2{font-size:21px}
 button{min-height:56px;font-size:17px}
 .actions{grid-template-columns:1fr}
 .library-controls,
 .library-filters,
 .library-buttons{grid-template-columns:1fr}
 .library-buttons button{min-height:48px;font-size:15px}
 body.player-mode .wrap{align-items:flex-start}
 body.player-mode .video{width:100vw}
}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<h2>YouTube 동영상 단독 재생</h2>
<p>YouTube 주소를 붙여넣고 재생을 누르세요.</p>
<input id="u" placeholder="YouTube 주소 붙여넣기">
<button onclick="play()">재생</button>
</div>
<div class="video" id="v"></div>
<div class="actions" id="actions">
<button class="share" onclick="shareVideo()">공유하기</button>
<button onclick="copyShareLink()">링크 복사</button>
</div>
<div class="box library" id="libraryBox">
<h2>저장된 동영상</h2>
<div class="library-controls">
<button onclick="connectDrive()">Google Drive 연결</button>
<button onclick="saveCurrentVideo()">목록에 저장</button>
</div>
<div class="library-filters">
<input id="searchLinks" placeholder="저장된 동영상 검색" oninput="renderLinks()">
<select id="sortLinks" onchange="renderLinks()">
<option value="newest">최신순</option>
<option value="oldest">오래된순</option>
<option value="favorite">즐겨찾기 우선</option>
</select>
</div>
<div class="library-status" id="libraryStatus"></div>
<div class="library-list" id="libraryList"></div>
</div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
</div>

<script>
const GOOGLE_CLIENT_ID="816430923713-0tl2cl1fdg06i1a1t3bum6uuai8hu0cs.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME="youtube-single-player-links.json";
const MAX_LINKS=1000;

let currentVideoId="";
let driveAccessToken="";
let driveTokenClient=null;
let driveFileId="";
let savedLinks=[];
let googleScriptLoading=false;

function extractVideoId(value){
 let x=value.trim();
 if(!x) return "";
 try{
  let a=new URL(x);
  if(a.hostname.includes("youtu.be"))
   return cleanVideoId(a.pathname.split("/")[1]);
  else if(a.pathname.includes("/shorts/"))
   return cleanVideoId(a.pathname.split("/shorts/")[1].split("/")[0]);
  else
   return cleanVideoId(a.searchParams.get("v") || "");
 }catch(e){
  return cleanVideoId(x);
 }
}

function cleanVideoId(id){
 return (id || "").split(/[?&#/]/)[0].replace(/[^a-zA-Z0-9_-]/g,"");
}

function getShareUrl(){
 return getShareUrlForId(currentVideoId);
}

function getShareUrlForId(id){
 let url=new URL(window.location.href);
 return url.origin+url.pathname+"?v="+encodeURIComponent(id)+"&player=1";
}

function setNotice(message){
 document.getElementById("notice").textContent=message;
 if(message) setTimeout(function(){
  if(document.getElementById("notice").textContent===message)
   document.getElementById("notice").textContent="";
 },2500);
}

function showVideo(id,updateUrl){
 currentVideoId=id;
 document.getElementById("v").innerHTML=
 '<iframe src="https://www.youtube-nocookie.com/embed/'+
 encodeURIComponent(id)+
 '?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
 if(!document.body.classList.contains("player-mode"))
  document.getElementById("actions").style.display="grid";

 if(updateUrl){
  let url=new URL(window.location.href);
  url.searchParams.set("v",id);
  url.searchParams.delete("player");
  history.replaceState(null,"",url);
 }

 renderLinks();
}

function play(){
 let id=extractVideoId(document.getElementById("u").value);

 if(!id){
  alert("YouTube 주소를 확인해주세요.");
  return;
 }

 showVideo(id,true);
}

async function copyText(text){
 if(navigator.clipboard && window.isSecureContext){
  await navigator.clipboard.writeText(text);
  return;
 }

 let temp=document.createElement("textarea");
 temp.value=text;
 temp.setAttribute("readonly","");
 temp.style.position="fixed";
 temp.style.left="-9999px";
 document.body.appendChild(temp);
 temp.select();
 document.execCommand("copy");
 document.body.removeChild(temp);
}

async function copyShareLink(){
 if(!currentVideoId) return;
 await copyVideoLink(currentVideoId);
}

async function copyVideoLink(id){
 try{
  await copyText(getShareUrlForId(id));
  setNotice("공유 링크를 복사했습니다.");
 }catch(e){
  alert("링크 복사에 실패했습니다.");
 }
}

async function shareVideo(){
 if(!currentVideoId) return;
 await shareVideoId(currentVideoId);
}

async function shareVideoId(id){
 let shareUrl=getShareUrlForId(id);
 if(navigator.share){
  try{
   await navigator.share({
    title:"YouTube 단독 재생",
    text:"이 YouTube 영상을 단독 재생으로 보기",
    url:shareUrl
   });
   return;
  }catch(e){
   if(e && e.name==="AbortError") return;
  }
 }
 await copyVideoLink(id);
}

window.addEventListener("DOMContentLoaded",function(){
 let params=new URLSearchParams(window.location.search);
 let id=extractVideoId(params.get("v") || "");
 let isPlayerMode=params.get("player")==="1";

 if(isPlayerMode)
  document.body.classList.add("player-mode");

 if(id){
  if(!isPlayerMode)
   document.getElementById("u").value=getManageUrlFromId(id);
  showVideo(id,false);
 }

 initLibrary();
});

function getManageUrlFromId(id){
 let url=new URL(window.location.href);
 url.searchParams.set("v",id);
 url.searchParams.delete("player");
 return url.origin+url.pathname+"?"+url.searchParams.toString();
}

function isGoogleClientConfigured(){
 return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID!=="YOUR_GOOGLE_CLIENT_ID";
}

function setLibraryStatus(message){
 let el=document.getElementById("libraryStatus");
 if(el) el.textContent=message;
}

function initLibrary(){
 if(document.body.classList.contains("player-mode")) return;

 if(!isGoogleClientConfigured()){
  setLibraryStatus("Google Drive 연결 설정이 필요합니다");
  renderLinks();
  return;
 }

 setLibraryStatus("Google Drive에 연결하면 저장된 동영상을 불러옵니다.");
 loadGoogleIdentityScript();
}

function loadGoogleIdentityScript(){
 if(window.google && google.accounts && google.accounts.oauth2){
  createTokenClient();
  return;
 }
 if(googleScriptLoading) return;
 googleScriptLoading=true;
 let script=document.createElement("script");
 script.src="https://accounts.google.com/gsi/client";
 script.async=true;
 script.defer=true;
 script.onload=createTokenClient;
 script.onerror=function(){
  setLibraryStatus("Google Drive 연결 스크립트를 불러오지 못했습니다.");
 };
 document.head.appendChild(script);
}

function createTokenClient(){
 if(driveTokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return;
 driveTokenClient=google.accounts.oauth2.initTokenClient({
  client_id:GOOGLE_CLIENT_ID,
  scope:DRIVE_SCOPE,
  callback:async function(response){
   if(response.error){
    setLibraryStatus("Google Drive 연결에 실패했습니다.");
    return;
   }
   driveAccessToken=response.access_token;
   setLibraryStatus("Google Drive에서 목록을 불러오는 중입니다.");
   await loadDriveLinks();
  }
 });
}

function connectDrive(){
 if(!isGoogleClientConfigured()){
  setLibraryStatus("Google Drive 연결 설정이 필요합니다");
  return;
 }
 if(!driveTokenClient){
  loadGoogleIdentityScript();
  setLibraryStatus("Google Drive 연결 준비 중입니다. 잠시 후 다시 눌러주세요.");
  return;
 }
 driveTokenClient.requestAccessToken({prompt:driveAccessToken ? "" : "consent"});
}

async function driveFetch(url,options){
 let response=await fetch(url,Object.assign({},options,{
  headers:Object.assign({},options && options.headers,{
   Authorization:"Bearer "+driveAccessToken
  })
 }));
 if(!response.ok)
  throw new Error("Drive API error: "+response.status);
 return response;
}

async function loadDriveLinks(){
 try{
  let query=encodeURIComponent("name='"+DRIVE_FILE_NAME+"'");
  let searchUrl="https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1&fields=files(id,name)&q="+query;
  let searchResponse=await driveFetch(searchUrl);
  let searchData=await searchResponse.json();
  if(searchData.files && searchData.files.length){
   driveFileId=searchData.files[0].id;
   let fileResponse=await driveFetch("https://www.googleapis.com/drive/v3/files/"+driveFileId+"?alt=media");
   let fileData=await fileResponse.json();
   savedLinks=Array.isArray(fileData.links) ? fileData.links.slice(0,MAX_LINKS) : [];
  }else{
   driveFileId="";
   savedLinks=[];
  }
  setLibraryStatus(savedLinks.length ? "저장된 동영상 "+savedLinks.length+"개" : "저장된 동영상이 없습니다.");
  renderLinks();
 }catch(e){
  setLibraryStatus("Google Drive 목록을 불러오지 못했습니다.");
 }
}

async function saveDriveLinks(){
 if(!driveAccessToken){
  setLibraryStatus("먼저 Google Drive에 연결해주세요.");
  return false;
 }

 let payload=JSON.stringify({links:savedLinks.slice(0,MAX_LINKS)},null,2);
 try{
  if(driveFileId){
   await driveFetch("https://www.googleapis.com/upload/drive/v3/files/"+driveFileId+"?uploadType=media",{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:payload
   });
  }else{
   let boundary="youtube_single_player_boundary";
   let metadata=JSON.stringify({name:DRIVE_FILE_NAME,parents:["appDataFolder"]});
   let body="--"+boundary+"\r\n"+
    "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
    metadata+"\r\n"+
    "--"+boundary+"\r\n"+
    "Content-Type: application/json; charset=UTF-8\r\n\r\n"+
    payload+"\r\n"+
    "--"+boundary+"--";
   let response=await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{
    method:"POST",
    headers:{"Content-Type":"multipart/related; boundary="+boundary},
    body:body
   });
   let data=await response.json();
   driveFileId=data.id;
  }
  setLibraryStatus("저장된 동영상 "+savedLinks.length+"개");
  return true;
 }catch(e){
  setLibraryStatus("Google Drive에 저장하지 못했습니다.");
  return false;
 }
}

async function saveCurrentVideo(){
 if(!currentVideoId){
  alert("먼저 YouTube 영상을 재생해주세요.");
  return;
 }
 if(!isGoogleClientConfigured()){
  setLibraryStatus("Google Drive 연결 설정이 필요합니다");
  return;
 }
 if(!driveAccessToken){
  setLibraryStatus("먼저 Google Drive에 연결해주세요.");
  return;
 }

 let now=new Date().toISOString();
 let existing=savedLinks.find(function(item){return item.id===currentVideoId;});
 if(existing){
  existing.updatedAt=now;
 }else{
  savedLinks.unshift({id:currentVideoId,title:currentVideoId,createdAt:now,updatedAt:now,favorite:false});
  savedLinks=savedLinks.slice(0,MAX_LINKS);
 }

 if(await saveDriveLinks()){
  renderLinks();
  setNotice("목록에 저장했습니다.");
 }
}

function getFilteredLinks(){
 let keyword=(document.getElementById("searchLinks").value || "").trim().toLowerCase();
 let sort=document.getElementById("sortLinks").value;
 let links=savedLinks.filter(function(item){
  return !keyword || item.id.toLowerCase().includes(keyword) || (item.title || "").toLowerCase().includes(keyword);
 });

 links.sort(function(a,b){
  if(sort==="oldest")
   return new Date(a.createdAt || 0)-new Date(b.createdAt || 0);
  if(sort==="favorite"){
   if(Boolean(a.favorite)!==Boolean(b.favorite))
    return a.favorite ? -1 : 1;
  }
  return new Date(b.createdAt || 0)-new Date(a.createdAt || 0);
 });
 return links;
}

function renderLinks(){
 let list=document.getElementById("libraryList");
 if(!list) return;
 list.innerHTML="";

 if(!isGoogleClientConfigured()){
  return;
 }

 let links=getFilteredLinks();
 if(!driveAccessToken){
  setLibraryStatus("Google Drive에 연결하면 저장된 동영상을 볼 수 있습니다.");
  return;
 }
 if(!links.length){
  list.textContent="표시할 동영상이 없습니다.";
  return;
 }

 links.forEach(function(item){
  let row=document.createElement("div");
  row.className="library-item";

  let title=document.createElement("div");
  title.className="library-title";
  title.textContent=item.title || item.id;
  row.appendChild(title);

  let meta=document.createElement("div");
  meta.className="library-meta";
  meta.textContent=item.createdAt ? new Date(item.createdAt).toLocaleString() : item.id;
  row.appendChild(meta);

  let buttons=document.createElement("div");
  buttons.className="library-buttons";
  buttons.appendChild(makeItemButton("재생",function(){playSavedVideo(item.id);}));
  buttons.appendChild(makeItemButton("공유",function(){shareVideoId(item.id);}));
  buttons.appendChild(makeItemButton("링크복사",function(){copyVideoLink(item.id);}));
  buttons.appendChild(makeItemButton(item.favorite ? "★" : "☆",function(){toggleFavorite(item.id);},item.favorite ? "favorite-on" : ""));
  buttons.appendChild(makeItemButton("삭제",function(){deleteSavedVideo(item.id);}));
  row.appendChild(buttons);

  list.appendChild(row);
 });
}

function makeItemButton(text,handler,className){
 let button=document.createElement("button");
 button.type="button";
 button.textContent=text;
 if(className) button.className=className;
 button.onclick=handler;
 return button;
}

function playSavedVideo(id){
 document.getElementById("u").value=getManageUrlFromId(id);
 showVideo(id,true);
 window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleFavorite(id){
 let item=savedLinks.find(function(link){return link.id===id;});
 if(!item) return;
 item.favorite=!item.favorite;
 item.updatedAt=new Date().toISOString();
 if(await saveDriveLinks()) renderLinks();
}

async function deleteSavedVideo(id){
 savedLinks=savedLinks.filter(function(item){return item.id!==id;});
 if(await saveDriveLinks()){
  renderLinks();
  setNotice("목록에서 삭제했습니다.");
 }
}
</script>
</body>
</html>
